name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: |
          cd halo-system/backend
          npm install
      - name: Initialize database
        run: |
          cd halo-system/backend
          npm run db:setup

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.RAILWAY_API_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deploy to Railway
        uses: railwayapp/railway-action@v2
        with:
          command: up --yes
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
